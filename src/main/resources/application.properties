spring.application.name=Lockium
spring.config.import=optional:classpath:config/secrets.properties
spring.profiles.default=prod

botcommands.core.predefinedOwnerIds = 158917227108761600
botcommands.text.usePingAsPrefix=true
botcommands.app.emojis.enable=true
botcommands.application.testGuildIds = 1483908386348208223
botcommands.application.cache.checkOnline=true

lockium.status = Enjoy your day!
lockium.render-url = https://s3.amazonaws.com/world.growtopiagame.com/
lockium.items-cache-duration = 1h
lockium.wiki-raw-url = https://growtopiawiki.com
lockium.scraped-effects-path = data/ScrapedEffects.txt

# The proxy refreshes /detail every minute and /leaderboard every 4 minutes; polling faster only
# re-reads its cache. Retention deliberately exceeds the graph window so pruning cannot race a read.
lockium.proxy.url = https://proxy.growtopiawiki.com
lockium.proxy.detail-poll-interval = 1m
lockium.proxy.leaderboard-poll-interval = 4m
lockium.proxy.graph-window = 24h
lockium.proxy.sample-retention = 26h

wiki.api.url=https://api.growtopiawiki.com

# In-memory H2 in PostgreSQL compatibility mode, as BotCommands expects.
# DB_CLOSE_DELAY=-1 is mandatory: without it H2 discards the database as soon as the last
# connection closes, and Hikari closes idle connections by design.
spring.datasource.url = jdbc:h2:mem:lockium;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username = sa
spring.datasource.hikari.pool-name = lockium-db
spring.datasource.hikari.maximum-pool-size = 5
# Hikari properties bind onto HikariDataSource's own setters, which take a plain long of
# milliseconds - Spring's Duration parsing does not apply here, so "10s" fails to start.
spring.datasource.hikari.leak-detection-threshold = 10000

# Lockium owns the "lockium" schema; BotCommands owns "bc" (migrated separately in FlywayConfig).
spring.flyway.locations = classpath:db/migration
spring.flyway.schemas = lockium
spring.flyway.default-schema = lockium
spring.flyway.create-schemas = true

# The default scheduler is single-threaded; the wiki refresh already blocks it for whole seconds.
spring.task.scheduling.pool.size = 4
spring.task.scheduling.thread-name-prefix = lockium-sched-
